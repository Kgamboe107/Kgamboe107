name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build installer
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Ops Command Desk v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*
          body: |
            ## Download

            | Your computer | File |
            |---|---|
            | **Windows 10/11** | `Ops-Command-Desk-Setup-${{ steps.v.outputs.version }}.exe` |
            | **Mac (Apple Silicon: M1/M2/M3/M4)** | `Ops-Command-Desk-${{ steps.v.outputs.version }}-mac-arm64.dmg` |
            | **Mac (Intel)** | `Ops-Command-Desk-${{ steps.v.outputs.version }}-mac-x64.dmg` |
            | **Linux** | `.AppImage` (any distro) or `.deb` (Ubuntu/Debian) |

            **First launch:** the app isn't code-signed yet, so your computer will warn you once.
            - **Windows:** on "Windows protected your PC" click **More info → Run anyway**.
            - **Mac:** open the .dmg, drag the app to Applications, then **right-click the app → Open → Open**. If macOS says the app "is damaged", run `xattr -cr "/Applications/Ops Command Desk.app"` in Terminal and open it again.
