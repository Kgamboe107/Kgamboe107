name: Publish private web version (Cloudflare)

# Publishes the phone / web version to Cloudflare Pages. Cloudflare Access (set up once in the Cloudflare
# dashboard) makes the site send nothing until you sign in, so only you can load the app or its code.
# Only needed if you don't use Cloudflare's own GitHub connection. With the connection, Cloudflare builds the
# site itself (build command: bash scripts/build-web.sh, output: _site) and this workflow skips publishing.
# Without it, add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the web app (includes the privacy check)
        run: bash scripts/build-web.sh
      - name: Skip if Cloudflare isn't set up yet
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: if [ -z "$TOKEN" ]; then echo "Cloudflare secrets not added yet; nothing published."; echo "ready=no" >> "$GITHUB_OUTPUT"; else echo "ready=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.ready == 'yes'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=ops-command-desk --branch=main
