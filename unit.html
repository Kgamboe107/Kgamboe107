<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="unit/manifest.webmanifest">
  <link rel="apple-touch-icon" href="unit/icons/icon-180.png">
  <link rel="icon" href="unit/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Unit Command">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#06080d">
  <meta name="format-detection" content="telephone=no">
  <meta name="color-scheme" content="dark light">
  <title>Unit Command</title>
  <link rel="preload" href="vendor/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="unit/css/unit.css">
  <script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("ocd.theme"))||"dark"}catch(e){document.documentElement.dataset.theme="dark"}document.documentElement.classList.add("uc");</script>
</head>
<body>
  <div id="ucSplash" class="uc-splash"><div class="uc-mark lg">UC</div></div>
  <div class="uc-app">
    <aside class="uc-side" id="ucSide">
      <div class="uc-brand"><div class="uc-mark" id="ucMark">UC</div><div><div class="uc-bname" id="ucBrand">Unit Command</div><div class="uc-btag" id="ucTag"></div></div></div>
      <nav id="ucNav" aria-label="Main"></nav>
      <div class="uc-sidefoot"><span class="badge" id="ucPlan">Full</span><div class="muted tiny lock" id="syncDot" data-state="local"><span class="lbl">On this device</span></div></div>
    </aside>
    <main class="uc-main">
      <header class="uc-top">
        <button class="btn ghost small icon-btn uc-menu" id="ucMenu" aria-label="Menu"><span data-icon="menu"></span></button>
        <h1 id="ucTitle">Today</h1>
        <div class="uc-topact"><span class="uc-aichip" data-aichip></span><button class="btn ghost small icon-btn" id="ucTheme" aria-label="Light or dark mode" title="Light or dark mode"><span data-icon="sun"></span></button></div>
      </header>
      <div class="win-ctl" id="winCtl" hidden>
        <button id="wcMin" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 14 14"><path d="M3 7h8"/></svg></button>
        <button id="wcMax" title="Maximize" aria-label="Maximize"><svg viewBox="0 0 14 14"><rect x="3" y="3" width="8" height="8" rx="1.5"/></svg></button>
        <button id="wcClose" class="close" title="Close" aria-label="Close"><svg viewBox="0 0 14 14"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7"/></svg></button>
      </div>
      <section id="ucView" class="uc-view"></section>
    </main>
  </div>
  <nav class="uc-tabs" id="ucTabs" aria-label="Quick navigation"></nav>
  <div id="modal" class="modal" hidden><div class="modal-card" id="modalCard"></div></div>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="vendor/chart.umd.min.js"></script>
  <script src="vendor/pdf.min.js"></script>
  <script src="vendor/qrcode.min.js"></script>
  <!-- Shared core with Ops Command Desk: storage, units, importers, sign-in and sync -->
  <script src="js/version.js"></script>
  <script src="js/core.js"></script>
  <script src="js/biz.js"></script>
  <script src="js/store.js"></script>
  <script src="js/pdfx.js"></script>
  <script src="js/pptx.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/banking.js"></script>
  <script src="js/router.js"></script>
  <script src="js/pnl.js"></script>
  <script src="js/ingest.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/ux.js"></script>
  <script src="js/period.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ollama.js"></script>
  <script src="js/purchasing.js"></script>
  <script src="js/compliance.js"></script>
  <script src="js/legal.js"></script>
  <script src="js/guest.js"></script>
  <script src="js/wealth.js"></script>
  <script src="js/lock.js"></script>
  <script src="js/cloud.js"></script>
  <!-- Unit Command -->
  <script src="unit/js/brand.js"></script>
  <script src="unit/js/catalog.js"></script>
  <script src="unit/js/playbooks.js"></script>
  <script src="unit/js/data.js"></script>
  <script src="unit/js/engine.js"></script>
  <script src="unit/js/ai-agents.js"></script>
  <script src="unit/js/screens.js"></script>
  <script src="unit/js/app.js"></script>
</body>
</html>
